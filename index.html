<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css?v=1.1">
  <script src="js/skin_builder.js" defer></script>
  <title>WEBPAGE_GONERMAKER_MINECRAFT</title>
</head>
<body>
  <h1>Deltarune Vessel skin creator</h1> 
  <div class="box_container">
    <div class="sprite_box">
      <canvas class="sprite_canvas" id="live_skin_canvas" width="64" height="64">
      </canvas>
    </div>
    <div class="preview_box" id="preview_box"> 
      <canvas id="canvas-container"></canvas>
      <script type="module" src="./main.js" defer></script>
    </div>
  </div>
  <div class="input_box">
    <h3>options go here</h3>
    <label for="model">SELECT THE PREFERRED MODEL</label>
    <select id="model">
      <option value="1">SLIM</option>
      <option value="2">WIDE</option> 
    </select>
    <p></p>
    <label for="head">SELECT THE HEAD THAT YOU PREFER</label>
    <select id="head">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
    </select>
    <p></p>
    <label for="body">SELECT THE BODY THAT YOU PREFER</label>
    <select id="body">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
    </select>    
    <p></p>
    <label for="hair">DOES IT'S HAIR EXTEND OUTWARD?</label>
    <input type="checkbox" id="hair" value="true">
    <p></p>
    <label for="blush">DOES IT EXPRESS LOVE?</label>
    <input type="checkbox" id="blush" value="true">
    <p></p>
  </div> 
</body>
</html>
